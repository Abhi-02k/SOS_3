<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Radar Glow Ring -->
  <circle cx="32" cy="32" r="30" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4" />
  
  <!-- Shield Background -->
  <path d="M32 6 L52 14 V30 C52 44 42 54 32 58 C22 54 12 44 12 30 V14 Z" fill="url(#shieldGrad)" filter="url(#glow)" />
  
  <!-- Inner Tactical Border -->
  <path d="M32 10 L48 16.5 V29 C48 40.5 40 49 32 53 C24 49 16 40.5 16 29 V16.5 Z" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" fill="none" />
  
  <!-- Radar Wave Rays -->
  <path d="M22 28 C22 22.477 26.477 18 32 18 C37.523 18 42 22.477 42 28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M26 31 C26 27.686 28.686 25 32 25 C35.314 25 38 27.686 38 31" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Center Beacon Pulse Dot -->
  <circle cx="32" cy="36" r="3.5" fill="#ffffff" />
  <circle cx="32" cy="36" r="5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6" />
</svg>
